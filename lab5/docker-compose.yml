services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=library_user
      - POSTGRES_PASSWORD=library_pass
      - POSTGRES_DB=library5
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      - DATABASE_URL=postgresql+psycopg2://library_user:library_pass@db:5432/library5
    ports:
      - "5000:5000"
    depends_on:
      - db
