version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: library7_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=library7
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: library7_redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: library7_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/library7
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
