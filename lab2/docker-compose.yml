version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: library_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=library
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: library_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/library
    depends_on:
      - db